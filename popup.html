<!DOCTYPE html>
<html>
<head>
  <title>My Custom Clipboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>My Custom Clipboard</h1>
    <div id="clipboard-list">
      </div>
    <div class="add-new-section">
      <h2>Add New Item Manually</h2>
      <textarea id="newItemText" placeholder="Enter text to add"></textarea>
      <button id="addItemBtn">Add Item</button>
    </div>
  </div>

  <div id="copy-notification" class="copy-notification">
    Copied!
  </div>

  <script src="popup.js"></script>
</body>
</html>
